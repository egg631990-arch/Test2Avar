<!DOCTYPE html>
<html>
<head>
  <meta http-equiv="CONTENT-TYPE" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pay</title>
  <link rel="stylesheet" href="css/main-pay.css">
</head>
<body>
  
  <div id="avatar-container">
    <img id="avatar-img" src="" alt="Аватар" style="width:50px; height:50px; border-radius:50%;">
  </div>

  <div id="pay-container">
    <h2>Пополнение баланса</h2>
    
    <!-- Текущий баланс -->
    <div id="balance-display">
      <span>Баланс: </span>
      <span id="balance-value">0</span>
      <span> ⭐</span>
    </div>
    
    <div class="input-group">
      <label for="stars-input">Количество звёзд для пополнения</label>
      <input type="number" id="stars-input" placeholder="Введите сумму" min="1" value="10">
    </div>
    
    <button id="pay-button">Пополнить</button>
    <div id="result-message"></div>
  </div>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="js/index-pay.js"></script>
</body>
</html>
